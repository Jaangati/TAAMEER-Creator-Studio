name: Inspect public TikTok reel references
on:
  push:
    paths:
      - '.github/workflows/inspect-reel-references.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public TikTok metadata and covers
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          from html.parser import HTMLParser
          class Meta(HTMLParser):
              def __init__(self):super().__init__();self.out={}
              def handle_starttag(self,tag,attrs):
                  if tag != 'meta':return
                  d=dict(attrs);key=d.get('property') or d.get('name')
                  if key in ('og:image','og:title','twitter:image','twitter:title'):self.out[key]=d.get('content','')
          links=[
            'https://www.tiktok.com/@hossam_allam__/video/7660660373145586962',
            'https://www.tiktok.com/@dxb1realestate/video/7601890111059496213',
            'https://www.tiktok.com/@walid_alzarooni/video/7605991997064760594',
          ]
          for i,url in enumerate(links,1):
              print('REFERENCE_'+str(i)+'_BEGIN',flush=True)
              agent={'User-Agent':'Mozilla/5.0','Accept-Language':'en-US,en;q=0.9'}
              api='https://www.tiktok.com/oembed?url='+urllib.parse.quote(url,safe='')
              try:
                  with urllib.request.urlopen(urllib.request.Request(api,headers=agent),timeout=15) as res:
                      data=json.load(res)
                  for key in ['title','author_name','thumbnail_url','embed_product_id']:
                      if data.get(key):print(key.upper()+'='+str(data[key])[:2000],flush=True)
              except Exception as e:print('OEMBED_ERROR='+str(e)[:250],flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=agent),timeout=15) as res:
                      doc=res.read(2200000).decode('utf-8','replace')
                  p=Meta();p.feed(doc)
                  for key,value in p.out.items():print('PAGE_'+key.upper().replace(':','_')+'='+value[:1800],flush=True)
              except Exception as e:print('PAGE_ERROR='+str(e)[:250],flush=True)
              print('REFERENCE_'+str(i)+'_END',flush=True)
          PY
