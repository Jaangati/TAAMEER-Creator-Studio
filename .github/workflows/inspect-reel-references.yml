name: Inspect public TikTok reel references
on:
  push:
    paths:
      - '.github/workflows/inspect-reel-references.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Resolve public TikTok links and inspect official previews
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          urls=['https://vt.tiktok.com/ZSpD7U3Jx/','https://vt.tiktok.com/ZSpD7ypWE/','https://vt.tiktok.com/ZSpD7FcRs/']
          for index,url in enumerate(urls,1):
              print(f'REFERENCE_{index}_BEGIN',flush=True)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; TAAMEER-ReelReferenceVerifier/1.0)'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      target=r.geturl()
                  print('CANONICAL='+target,flush=True)
                  api='https://www.tiktok.com/oembed?url='+urllib.parse.quote(target,safe='')
                  with urllib.request.urlopen(urllib.request.Request(api,headers={'User-Agent':'Mozilla/5.0'}),timeout=12) as r:
                      metadata=json.load(r)
                  for k in ['title','author_name','author_url','thumbnail_url','embed_product_id','thumbnail_width','thumbnail_height']:
                      if metadata.get(k):print(k.upper()+'='+str(metadata[k]),flush=True)
              except Exception as e:
                  print('LOOKUP_ERROR='+str(e)[:300],flush=True)
              print(f'REFERENCE_{index}_END',flush=True)
          PY
