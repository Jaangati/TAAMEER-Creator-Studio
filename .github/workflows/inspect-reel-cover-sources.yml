name: Refresh public reel cover images
on:
  push:
    paths:
      - 'references/reels.json'
      - '.github/workflows/inspect-reel-cover-sources.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install lightweight cover processor
        run: python -m pip install --quiet Pillow
      - name: Collect verified poster images only (never video files)
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json,os,time,io
          from PIL import Image,ImageOps
          path='references/reels.json'
          with open(path,encoding='utf-8') as f: data=json.load(f)
          folder='assets/reel-covers';os.makedirs(folder,exist_ok=True)
          headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,*/*'}
          count=0
          for row in data['references']:
            id=str(row.get('tiktok_video_id') or '')
            if not (id.isdigit() and 15<=len(id)<=21): continue
            dest=f'{folder}/{id}.jpg'
            if os.path.isfile(dest) and os.path.getsize(dest)>3000:
              row['thumbnail_url']='assets/reel-covers/'+id+'.jpg'
              continue
            original=row['url']
            endpoint='https://www.tikwm.com/api/?url='+urllib.parse.quote(original,safe='')
            try:
              with urllib.request.urlopen(urllib.request.Request(endpoint,headers=headers),timeout=15) as res:
                d=json.load(res)
              if d.get('code')!=0 or not isinstance(d.get('data'),dict):
                print('NO_COVER',id,'metadata-unavailable',flush=True);continue
              entry=d['data'];covers=[entry.get('cover'),entry.get('origin_cover')]
              saved=False
              for source in filter(None,covers):
                if not source.startswith('https://'):continue
                try:
                  with urllib.request.urlopen(urllib.request.Request(source,headers={'User-Agent':'Mozilla/5.0'}),timeout=15) as res:
                    ct=res.headers.get('Content-Type','')
                    body=res.read(1500000)
                  if 'image/' not in ct or len(body)<3000 or len(body)>=1500000:continue
                  with Image.open(io.BytesIO(body)) as im:
                    if im.width<100 or im.height<100:continue
                    im=ImageOps.exif_transpose(im).convert('RGB')
                    im.thumbnail((450,700))
                    im.save(dest,'JPEG',quality=78,optimize=True)
                  row['thumbnail_url']='assets/reel-covers/'+id+'.jpg'
                  saved=True;count+=1
                  print('COVER_SAVED',id,os.path.getsize(dest),'bytes',flush=True)
                  break
                except Exception as e:
                  print('COVER_SOURCE_FAILED',id,str(e)[:130],flush=True)
              if not saved:print('NO_COVER',id,'image-not-accessible',flush=True)
            except Exception as e:
              print('LOOKUP_FAILED',id,str(e)[:140],flush=True)
            time.sleep(0.7)
          with open(path,'w',encoding='utf-8') as f:
            json.dump(data,f,indent=2,ensure_ascii=False);f.write('\n')
          print('NEW_COVERS',count,'TOTAL_REFERENCES',len(data['references']),flush=True)
          PY
      - name: Commit verified poster thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/reels.json assets/reel-covers/
          if ! git diff --cached --quiet; then
            git commit -m "Cache lightweight verified TikTok reel covers for fast card previews"
            git push
          else
            echo "No new covers to publish."
          fi
