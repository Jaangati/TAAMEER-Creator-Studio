<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAAMEER Creator Studio</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{font-family:'DM Sans',sans-serif;color:#e8eaf3;background:#0c111b}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}a{color:#a5c0ff}.layout{display:flex;min-height:100vh}.sidebar{width:250px;background:#101725;padding:28px 18px;position:sticky;top:0;height:100vh;border-right:1px solid #263247;display:flex;flex-direction:column}.brand{font-size:22px;letter-spacing:.1em;font-weight:800}.brand small{display:block;font-size:10px;letter-spacing:.22em;color:#b39b70;margin-top:4px}.nav{margin-top:40px;display:grid;gap:6px}.nav button{border:0;color:#9ba8ba;background:transparent;text-align:left;padding:13px;border-radius:10px}.nav button.active,.nav button:hover{color:#fff;background:#25354b}.sidefoot{margin-top:auto;font-size:12px;color:#7d8b9d}.main{flex:1;min-width:0;padding:24px 34px;max-width:1550px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #223044;padding-bottom:19px;margin-bottom:30px}.eyebrow{color:#b99b72;font-size:11px;letter-spacing:.22em;text-transform:uppercase;font-weight:700}.top span{font-size:13px;color:#a9b5c8}.heading h1{font-size:34px;letter-spacing:-.04em;margin:7px 0}.muted{color:#9aa8bb;font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#141e2d;border:1px solid #29374b;border-radius:18px;padding:23px;margin-bottom:18px}.card h3{margin:0 0 15px}.metric{font-size:35px;font-weight:800;margin:7px 0}.label{font-size:12px;color:#9aa8bb}.pill{display:inline-block;background:#27394d;color:#b9ccdf;border-radius:30px;padding:6px 10px;font-size:11px;margin:3px}.btn{background:#bb9f73;border:0;color:#131923;padding:11px 17px;border-radius:9px;font-weight:800}.btn.secondary{color:#d8e2ef;background:#263549}.btn.tiny{padding:7px 11px;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#9aa8bb;margin-bottom:9px}input,select,textarea{width:100%;background:#0d1623;color:#edf1f8;border:1px solid #324259;border-radius:9px;padding:12px;outline:0}textarea{min-height:125px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#bb9f73}.composer{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.output{white-space:pre-wrap;line-height:1.85;color:#e5eefa;background:#0e1724;padding:21px;border-radius:12px;border:1px solid #2b3b50}.listrow{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid #27364a;padding:14px 0}.idea{border:1px solid #314058;border-radius:12px;padding:18px;margin:12px 0;background:#101a28}.idea strong{display:block;font-size:17px;margin:9px 0}.auth{max-width:420px;margin:10vh auto;padding:38px;background:#141e2d;border:1px solid #314058;border-radius:20px}.chat{height:290px;overflow:auto;background:#0c1521;padding:14px;border-radius:12px;border:1px solid #2e4054;margin-bottom:14px}.bubble{padding:13px;border-radius:11px;background:#203148;max-width:87%;margin-bottom:10px;white-space:pre-wrap;line-height:1.65}.bubble.me{margin-left:auto;background:#55462f}.notice{background:#2e2920;color:#e4c58b;padding:12px 15px;border-radius:9px;font-size:13px;margin:12px 0}.hide{display:none!important}.tele{font-size:32px;line-height:1.8;text-align:center;padding:28px;max-height:50vh;overflow:auto}.status{font-size:12px;color:#82c2aa}small{color:#9aa8bb}@media(max-width:900px){.sidebar{width:74px;padding:18px 8px}.brand{font-size:16px}.brand small,.sidefoot,.nav button span{display:none}.nav button{text-align:center}.main{padding:20px}.grid,.grid.two{grid-template-columns:1fr}.composer{grid-template-columns:1fr 1fr}}@media(max-width:520px){.sidebar{width:52px}.main{padding:13px}.top{gap:6px}.heading h1{font-size:27px}.composer{grid-template-columns:1fr}.card{padding:16px}}
</style></head><body><div id="root"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.81.1';
const sb=createClient('https://hylcxekemqttsyfnsiov.supabase.co',"sb_publishable_LW0kaE_sYUQnDpyktCE0qQ_5dQW-TDY");
const root=document.querySelector('#root'),projects=[
{slug:'general',name:'Qatar Real Estate',location:'Qatar',facts:['Educational content only. Never guarantee investment returns.']},
{slug:'sama',name:'Sama Residence',location:'Lusail Boulevard South',facts:['Residential project by TAAMEER','Located at Lusail Boulevard South']},
{slug:'the-one',name:'The One by TAAMEER',location:'Qetaifan Island North',facts:['TAAMEER development on Qetaifan Island North']},
{slug:'sukoon',name:'Sukoon Tower',location:'Lusail Kharayej',facts:['Residential tower in Lusail Kharayej']},
{slug:'valencia-thani',name:'Valencia Thani Residence',location:'Lusail Boulevard East',facts:['TAAMEER residential project at Lusail Boulevard East']},
{slug:'canal-bay',name:'Canal Bay Residence',location:'Qetaifan Island North',facts:['TAAMEER residential development on Qetaifan Island North']},
{slug:'skala',name:'Skala Tower',location:'Lusail Waterfront',facts:['TAAMEER waterfront development in Lusail']}
];
const hooks=['Before you buy in {location}, ask this question.','Most buyers overlook this detail in {location}.','Three things to check before choosing {project}.','Is {project} right for your lifestyle or investment goals?','The first thing I check when a client asks about {project}.','A beautiful home is not automatically a smart investment.','Here is how I help clients compare properties in {location}.','The one mistake buyers should avoid before a showroom visit.','Let me show you what makes this location worth exploring.','Would you prioritize location, layout, or payment flexibility?','You have 30 seconds? Here is what to know about {project}.','What should you ask before reserving an apartment?','Price is not the only factor to consider.','Here is how to shortlist properties without feeling overwhelmed.','An insider tip from a TAAMEER property advisor.','Does buying for yourself change what matters?','Not all properties suit all buyers — here is why.','Questions to ask about construction progress.','Three things you must verify before buying off-plan.','Behind the scenes of a property consultation.'];
const formats=['Walk and talk','Talking head','Showroom tour','Voiceover','Buyer checklist','Q&A','Behind the scenes','Location guide','Project introduction','Myth vs fact','Three-point explainer','POV walk-through'];
const audiences=['First-time buyers','Investors','Families','Luxury buyers','Relocating professionals','Qatar residents','General audience'];
const angles=['Education','Lifestyle','Location','Investment basics','Objection handling','Project introduction','Personal branding'];
let S={salesMode:false,salesPassword:'',page:'overview',project:'sama',duration:'30',language:'English',location:'Showroom',audience:'First-time buyers',angle:'Education',user:null,role:'agent',saved:[],plans:[],chat:[],output:'',ideas:[],projectList:projects};
const API='https://hylcxekemqttsyfnsiov.supabase.co/functions/v1/creator-studio'; async function salesApi(action,payload={}){let r=await fetch(API+'?api=1',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,password:S.salesPassword,...payload})});let d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d} const E=t=>String(t??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const byId=id=>document.getElementById(id);
const choice=(items,val)=>items.map(x=>'<option '+(x===val?'selected':'')+'>'+E(x)+'</option>').join('');
const current=()=>S.projectList.find(p=>p.slug===S.project)||S.projectList[0];
const fill=(x,p)=>x.replaceAll('{location}',p.location).replaceAll('{project}',p.name);
const idea=(n=0)=>{const p=current(),h=fill(hooks[(n*7+Math.floor(Math.random()*hooks.length))%hooks.length],p),f=formats[n%formats.length];return {id:crypto.randomUUID(),project:p.name,hook:h,format:f,audience:S.audience,angle:S.angle,duration:S.duration,location:S.location,language:S.language,script:script(h,p,f)}};
function script(h,p,f){return 'HOOK (0–5s)\n'+h+'\n\nSCENE 1 (5–12s) — '+S.location+' / '+f+'\nIntroduce '+p.name+' as a project located in '+p.location+'.\n\nSCENE 2 (12–22s) — Show approved visuals or project model\n'+(p.facts||[]).slice(0,2).join('. ')+'. Explain what to verify before buying, based on your experience.\n\nCLOSE (final seconds)\nTell me your property requirements and I will help you explore suitable options.\n\nRECORDING NOTES\nUse a smartphone in vertical 9:16, natural daylight, stable framing, and short cuts. Verify all facts with Marketing before publication.'}
const heading=(k,t,d='')=>'<div class="heading"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+d+'</p></div>';
function shell(body){root.innerHTML='<div class="layout"><aside class="sidebar"><div class="brand">TAAMEER<small>CREATOR STUDIO</small></div><div class="nav">'+[['overview','▦','Overview'],['brain','✦','Creator Brain'],['ideas','▤','Idea Generator'],['scripts','✎','Script Studio'],['knowledge','◈','Knowledge Base'],['planner','▣','Content Planner'],['saved','♡','Saved Content'],['admin','⚙','Marketing Admin']].map(([id,ico,title])=>'<button class="'+(S.page===id?'active':'')+'" data-go="'+id+'">'+ico+' <span>'+title+'</span></button>').join('')+'</div><div class="sidefoot">TAAMEER · Internal workspace</div></aside><main class="main"><div class="top"><span>MARKETING / SALES ENABLEMENT</span><button class="btn secondary tiny" id="logout">Sign out</button></div>'+body+'</main></div>';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.page=b.dataset.go;render()});byId('logout').onclick=()=>{if(S.salesMode){S.salesPassword='';S.salesMode=false;S.user=null;S.saved=[];S.plans=[];render()}else sb.auth.signOut()};}
function form(){return '<div class="composer">'+[['project','Project',S.projectList.map(x=>[x.slug,x.name])],['audience','Audience',audiences.map(x=>[x,x])],['location','Filming location',['Showroom','Project site','Office','Outdoor','At home'].map(x=>[x,x])],['duration','Duration',['15','30','60'].map(x=>[x,x])]].map(([id,label,opts])=>'<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts.map(([v,t])=>'<option value="'+E(v)+'" '+(S[id]===v?'selected':'')+'>'+E(t)+'</option>').join('')+'</select></div>').join('')+'</div>'}
function readForm(){for(const id of ['project','audience','location','duration'])if(byId(id))S[id]=byId(id).value;}
function overview(){shell(heading('WORKSPACE','Create content that converts','Your personal content production workspace. No complicated editing required.')+'<div class="grid">'+[['Project library',S.projectList.length,'Approved reference details'],['Your saved ideas',S.saved.length,'Only visible to your account'],['Planned content',S.plans.length,'From concept to published']].map(([t,v,d])=>'<div class="card"><div class="label">'+t+'</div><div class="metric">'+v+'</div><small>'+d+'</small></div>').join('')+'</div><div class="grid two"><div class="card"><h3>Start creating</h3><p class="muted">Generate ideas, write scripts, and plan simple video shoots for your own Instagram account.</p><div class="actions"><button class="btn" id="startBrain">Open Creator Brain</button><button class="btn secondary" id="startIdeas">Generate ideas</button></div></div><div class="card"><h3>Marketing quality checklist</h3>'+['Use approved facts only','Lead with value to buyers','Never promise investment returns','Shoot vertical video','Include a helpful, clear CTA'].map(x=>'<p class="muted">✓ '+x+'</p>').join('')+'</div></div>');byId('startBrain').onclick=()=>{S.page='brain';render()};byId('startIdeas').onclick=()=>{S.page='ideas';render()}}
function brain(){shell(heading('CREATIVE INTELLIGENCE','Creator Brain','Rule-based coaching powered by project facts and approved creative frameworks.')+'<div class="card">'+form()+'<div class="chat" id="chat">'+S.chat.map(x=>'<div class="bubble '+(x.me?'me':'')+'">'+E(x.t)+'</div>').join('')+'</div><div class="actions"><button data-prompt="Give me three video ideas">3 reel ideas</button><button data-prompt="Write a complete reel script">Complete script</button><button data-prompt="Give me filming instructions">Filming plan</button><button data-prompt="What do we know about this project?">Project facts</button></div><textarea id="message" placeholder="Ask for a reel concept, script, hook, filming plan or project facts..."></textarea><div class="actions"><button class="btn" id="send">Send message</button></div><small>Controlled rule engine — not a general AI chatbot. English-first templates. Project claims require Marketing verification.</small></div>');byId('chat').scrollTop=byId('chat').scrollHeight;document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{byId('message').value=b.dataset.prompt;send()});byId('send').onclick=send}
function send(){readForm();const q=byId('message').value.trim();if(!q)return;let answer='',p=current();if(/fact|know|amenit|location|detail/i.test(q))answer=p.name+' — '+p.location+'\n'+(p.facts||[]).map(x=>'• '+x).join('\n')+'\n\nOnly approved, verified claims should be published.';else if(/film|shoot|edit|camera/i.test(q))answer='FILMING PLAN\n1. Record vertical 9:16 on your phone.\n2. Shoot your opening hook in '+S.location+'.\n3. Show approved project visuals or a model.\n4. Record 2–3 short clips explaining buyer value.\n5. Add captions in CapCut and end with a CTA.\nAvoid claims you cannot verify.';else if(/idea|hook|concept/i.test(q))answer=Array.from({length:3},(_,i)=>{const a=idea(i+S.chat.length);return (i+1)+'. '+a.hook+'\nFormat: '+a.format}).join('\n\n');else answer=idea(S.chat.length).script;S.chat.push({me:true,t:q},{me:false,t:answer});render()}
function ideas(){shell(heading('IDEATION','Idea Generator','Mix project intelligence, audience needs, filming formats, and conversion hooks.')+'<div class="card">'+form()+'<div class="actions"><button class="btn" id="generate">Generate 10 concepts</button></div></div><div id="results">'+S.ideas.map(a=>'<div class="idea"><div class="eyebrow">'+E(a.project)+' · '+E(a.format)+'</div><strong>'+E(a.hook)+'</strong><p class="muted">'+E(a.audience)+' · '+E(a.duration)+' seconds · '+E(a.location)+'</p><div class="actions"><button class="btn secondary tiny" data-copy="'+E(a.id)+'">Copy script</button><button class="btn tiny" data-save="'+E(a.id)+'">Save idea</button><button class="btn secondary tiny" data-plan="'+E(a.id)+'">Add to plan</button></div></div>').join('')+'</div>');byId('generate').onclick=()=>{readForm();S.ideas=Array.from({length:10},(_,i)=>idea(i));render()};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(S.ideas.find(x=>x.id===b.dataset.copy).script));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{await saveIdea(S.ideas.find(x=>x.id===b.dataset.save));b.textContent='Saved ✓'});document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{await savePlan(S.ideas.find(x=>x.id===b.dataset.plan));b.textContent='Planned ✓'})}
function scripts(){shell(heading('PRODUCTION','Script Studio','Generate a script, review factual claims and use the built-in teleprompter.')+'<div class="card">'+form()+'<div class="actions"><button class="btn" id="write">Write a reel script</button><button class="btn secondary" id="assess">Review my script</button><button class="btn secondary" id="tele">Teleprompter</button></div><div class="field"><label>Script editor</label><textarea id="script" style="min-height:300px" placeholder="Your script appears here. You can edit it or paste your own.">'+E(S.output)+'</textarea></div><div id="review"></div></div>');byId('write').onclick=()=>{readForm();S.output=idea(0).script;byId('script').value=S.output};byId('assess').onclick=()=>{S.output=byId('script').value;let flags=[];if(/guarantee|guaranteed|risk.free|ROI|% return|best investment/i.test(S.output))flags.push('Potential investment or superlative claim: review with Marketing.');if(/payment|price|amenities|handover|sqm|QAR/i.test(S.output))flags.push('Verify financial, delivery, and amenity details against current project approvals.');if(S.output.length<180)flags.push('Script may need more buyer value or context.');byId('review').innerHTML='<div class="notice">'+(flags.length?flags.map(E).join('<br>'):'Initial rules review passed. Human Marketing approval is still required.')+'</div>'};byId('tele').onclick=()=>{S.output=byId('script').value;shell(heading('RECORDING','Teleprompter','Scroll while recording on your phone.')+'<div class="card"><div class="tele">'+E(S.output).replaceAll('\n','<br>')+'</div><button class="btn" id="back">Back to Script Studio</button></div>');byId('back').onclick=()=>{S.page='scripts';render()}}}
function knowledge(){shell(heading('PROJECT DATA','Knowledge Base','Starter references only; unverified details are excluded from scripts.')+'<div class="grid two">'+S.projectList.map(p=>'<div class="card"><div class="eyebrow">'+E(p.location)+'</div><h3>'+E(p.name)+'</h3>'+p.facts.map(x=>'<p class="muted">• '+E(x)+'</p>').join('')+'<span class="pill">'+(p.approved?'Approved':'Review before publication')+'</span></div>').join('')+'</div>')}
async function saveIdea(x){if(S.salesMode){try{await salesApi('create',{kind:'idea',content:x})}catch(e){alert(e.message);return}}else{const {error}=await sb.from('saved_ideas').insert({user_id:S.user.id,content:x});if(error){alert(error.message);return}}await sync()}
async function savePlan(x){const content={...x,stage:'idea'};if(S.salesMode){try{await salesApi('create',{kind:'plan',content})}catch(e){alert(e.message);return}}else{const {error}=await sb.from('content_plans').insert({user_id:S.user.id,content,status:'idea'});if(error){alert(error.message);return}}await sync()}
function saved(){shell(heading('PERSONAL LIBRARY','Saved Content','Ideas you have saved for future filming.')+'<div class="card">'+(S.saved.length?S.saved.map(x=>'<div class="listrow"><div><strong>'+E(x.content.hook)+'</strong><div class="muted">'+E(x.content.project)+'</div></div><div class="actions"><button class="btn secondary tiny" data-copy="'+x.id+'">Copy</button><button class="btn secondary tiny" data-delete="'+x.id+'">Delete</button></div></div>').join(''):'No saved concepts yet.')+'</div>');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(S.saved.find(x=>x.id===b.dataset.copy).content.script));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(S.salesMode){await salesApi('delete',{id:b.dataset.delete})}else await sb.from('saved_ideas').delete().eq('id',b.dataset.delete);await sync();render()})}
function planner(){shell(heading('PRODUCTION PIPELINE','Content Planner','Organize the journey from idea to published video.')+'<div class="card">'+(S.plans.length?S.plans.map(x=>'<div class="listrow"><div><strong>'+E(x.content.hook)+'</strong><div class="muted">'+E(x.content.project)+'</div></div><div><select data-stage="'+x.id+'">'+['idea','filming','in_review','published'].map(v=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+v.replace('_',' ')+'</option>').join('')+'</select></div></div>').join(''):'No planned content. Start from Idea Generator.')+'</div>');document.querySelectorAll('[data-stage]').forEach(b=>b.onchange=async()=>{if(S.salesMode){await salesApi('status',{id:b.dataset.stage,status:b.value})}else await sb.from('content_plans').update({status:b.value}).eq('id',b.dataset.stage);await sync()})}
function admin(){if(S.role!=='admin'){shell(heading('ACCESS CONTROL','Marketing Admin','This section is restricted to Marketing administrators.')+'<div class="notice">Your account does not have administrator privileges. Contact Marketing.</div>');return}shell(heading('MARKETING CONTROL','Admin Workspace','Manage the approved project knowledge base.')+'<div class="grid two"><div class="card"><h3>Knowledge status</h3><div class="metric">'+S.projectList.length+'</div><p class="muted">Projects available to agents</p></div><div class="card"><h3>Review checklist</h3><p class="muted">Approve pricing, amenities, delivery dates, claims and Arabic/English names before publication.</p></div></div><div class="card"><h3>Current database content</h3>'+S.projectList.map(p=>'<div class="listrow"><strong>'+E(p.name)+'</strong><small>'+E(p.location)+'</small></div>').join('')+'<p class="muted">The current release manages project approval and updates through the Supabase dashboard. Inline editing is a next-phase feature.</p></div>')}
async function sync(){if(S.salesMode){const data=await salesApi('list');S.saved=data.ideas||[];S.plans=data.plans||[];S.role='agent';return}const [pr,saved,plans,role]=await Promise.all([sb.from('projects').select('*').eq('approved',true),sb.from('saved_ideas').select('*').order('created_at',{ascending:false}),sb.from('content_plans').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('role').eq('id',S.user.id).maybeSingle()]);if(pr.data?.length)S.projectList=pr.data;S.saved=saved.data||[];S.plans=plans.data||[];S.role=role.data?.role||'agent';if(!S.projectList.some(p=>p.slug===S.project))S.project=S.projectList[0]?.slug||'general'}
function auth(){root.innerHTML='<div class="auth"><h2>TAAMEER Creator Studio</h2><p>Sales access</p><input id="salesPassword" type="password" placeholder="Shared password"><button class="btn" id="salesLogin">Enter</button><p id="error"></p><details style="margin-top:25px"><summary>Marketing admin login</summary><input id="adminEmail" type="email" placeholder="Email"><input id="adminPassword" type="password" placeholder="Password"><button id="adminLogin" class="btn secondary">Admin sign in</button></details></div>';byId('salesLogin').onclick=async()=>{S.salesPassword=byId('salesPassword').value;try{await salesApi('list');S.salesMode=true;S.user={id:'sales'};await sync();render()}catch(e){S.salesPassword='';byId('error').textContent=e.message}};byId('adminLogin').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:byId('adminEmail').value,password:byId('adminPassword').value});if(error)byId('error').textContent=error.message}}
function render(){if(!S.user)return auth();({overview,brain,ideas,scripts,knowledge,planner,saved,admin}[S.page]||overview)()}
sb.auth.onAuthStateChange((_event,session)=>{if(S.salesMode)return;S.user=session?.user||null;setTimeout(async()=>{if(S.user)await sync();render()},0)});
</script></body></html>
