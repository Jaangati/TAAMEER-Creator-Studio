function brain(){const p=current();const suggestions=[['Find a fresh angle','Give me three engaging reel ideas about '+p.name],['Write my next reel','Write a complete 30-second reel script'],['Learn how to film','Give me filming instructions for my next reel'],['Check the details','What do we know about this project?']];const welcome='<div class="brain-empty"><div class="star">✳</div><h2>What shall we create today?</h2><p>Your TAAMEER content companion. Ask about projects, discover hooks, build scripts or get a simple shooting plan.</p><div class="suggest-grid">'+suggestions.map(([title,prompt])=>'<button class="suggestion" data-prompt="'+E(prompt)+'"><strong>'+E(title)+'</strong><br>'+E(prompt)+'</button>').join('')+'</div></div>';const messages=S.chat.map(x=>x.me?'<div class="msg user">'+E(x.t)+'</div>':'<div class="msg assistant"><div class="avatar">✳</div><div class="msgtext">'+E(x.t)+'</div></div>').join('');shell('<div class="brain-shell"><section class="brain-panel"><div class="brain-head"><div class="brain-title">✳ &nbsp; Creator Brain<small>TAAMEER Content Intelligence · Rule-based assistant</small></div><button class="btn secondary tiny" id="newchat">＋ New chat</button></div><div class="brain-chat" id="chat">'+(messages||welcome)+'</div><div class="brain-compose"><div class="composebox"><textarea id="message" placeholder="Message Creator Brain..." rows="2"></textarea><div class="composebottom"><span>Press Enter to send · Shift+Enter for new line</span><button id="send" class="sendbtn" aria-label="Send">↑</button></div></div><p class="muted" style="font-size:10px;text-align:center;margin:9px 0 0">Responses use controlled templates and approved reference data. Confirm claims with Marketing.</p></div></section><aside class="brain-side"><div class="eyebrow">CONVERSATION CONTEXT</div><h3 style="margin-top:10px">Make it relevant</h3><div class="field"><label>Choose project</label><select id="project">'+S.projectList.map(x=>'<option value="'+E(x.slug)+'" '+(x.slug===S.project?'selected':'')+'>'+E(x.name)+'</option>').join('')+'</select></div><div class="field"><label>Audience</label><select id="audience">'+choice(audiences,S.audience)+'</select></div><div class="field"><label>Where are you filming?</label><select id="location">'+choice(['Showroom','Project site','Office','Outdoor','At home'],S.location)+'</select></div><div class="field"><label>Video duration</label><select id="duration">'+choice(['15','30','60'],S.duration)+'</select></div><div class="tipbox"><strong style="color:#374936">Creator tip</strong><br>Tell the Brain what you are filming, who you are speaking to, and the value you want the viewer to gain.</div><div class="actions" style="margin-top:18px"><button class="btn secondary tiny" id="facts">Project facts</button><button class="btn secondary tiny" id="hooks">Fresh hooks</button></div></aside></div>');const chat=byId('chat');chat.scrollTop=chat.scrollHeight;byId('send').onclick=send;byId('newchat').onclick=()=>{S.chat=[];render()};byId('facts').onclick=()=>{byId('message').value='What do we know about this project?';send()};byId('hooks').onclick=()=>{byId('message').value='Give me three video ideas';send()};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{byId('message').value=b.dataset.prompt;send()});byId('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}}
function send(){readForm();const q=byId('message').value.trim();if(!q)return;let answer='',p=current();if(/fact|know|amenit|location|detail/i.test(q))answer=p.name+' — '+p.location+'\n'+(p.facts||[]).map(x=>'• '+x).join('\n')+'\n\nOnly approved, verified claims should be published.';else if(/film|shoot|edit|camera/i.test(q))answer='FILMING PLAN\n1. Record vertical 9:16 on your phone.\n2. Shoot your opening hook in '+S.location+'.\n3. Show approved project visuals or a model.\n4. Record 2–3 short clips explaining buyer value.\n5. Add captions in CapCut and end with a CTA.\nAvoid claims you cannot verify.';else if(/idea|hook|concept/i.test(q))answer=Array.from({length:3},(_,i)=>{const a=idea(i+S.chat.length);return (i+1)+'. '+a.hook+'\nFormat: '+a.format}).join('\n\n');else answer=idea(S.chat.length).script;S.chat.push({me:true,t:q},{me:false,t:answer});render()}
function ideas(){shell(heading('IDEATION','Idea Generator','Mix project intelligence, audience needs, filming formats, and conversion hooks.')+'<div class="card">'+form()+'<div class="actions"><button class="btn" id="generate">Generate 10 concepts</button></div></div><div id="results">'+S.ideas.map(a=>'<div class="idea"><div class="eyebrow">'+E(a.project)+' · '+E(a.format)+'</div><strong>'+E(a.hook)+'</strong><p class="muted">'+E(a.audience)+' · '+E(a.duration)+' seconds · '+E(a.location)+'</p><div class="actions"><button class="btn secondary tiny" data-copy="'+E(a.id)+'">Copy script</button><button class="btn tiny" data-save="'+E(a.id)+'">Save idea</button><button class="btn secondary tiny" data-plan="'+E(a.id)+'">Add to plan</button></div></div>').join('')+'</div>');byId('generate').onclick=()=>{readForm();S.ideas=Array.from({length:10},(_,i)=>idea(i));render()};document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(S.ideas.find(x=>x.id===b.dataset.copy).script));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{await saveIdea(S.ideas.find(x=>x.id===b.dataset.save));b.textContent='Saved ✓'});document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{await savePlan(S.ideas.find(x=>x.id===b.dataset.plan));b.textContent='Planned ✓'})}
function scripts(){shell(heading('PRODUCTION','Script Studio','Generate a script, review factual claims and use the built-in teleprompter.')+'<div class="card">'+form()+'<div class="actions"><button class="btn" id="write">Write a reel script</button><button class="btn secondary" id="assess">Review my script</button><button class="btn secondary" id="tele">Teleprompter</button></div><div class="field"><label>Script editor</label><textarea id="script" style="min-height:300px" placeholder="Your script appears here. You can edit it or paste your own.">'+E(S.output)+'</textarea></div><div id="review"></div></div>');byId('write').onclick=()=>{readForm();S.output=idea(0).script;byId('script').value=S.output};byId('assess').onclick=()=>{S.output=byId('script').value;let flags=[];if(/guarantee|guaranteed|risk.free|ROI|% return|best investment/i.test(S.output))flags.push('Potential investment or superlative claim: review with Marketing.');if(/payment|price|amenities|handover|sqm|QAR/i.test(S.output))flags.push('Verify financial, delivery, and amenity details against current project approvals.');if(S.output.length<180)flags.push('Script may need more buyer value or context.');byId('review').innerHTML='<div class="notice">'+(flags.length?flags.map(E).join('<br>'):'Initial rules review passed. Human Marketing approval is still required.')+'</div>'};byId('tele').onclick=()=>{S.output=byId('script').value;shell(heading('RECORDING','Teleprompter','Scroll while recording on your phone.')+'<div class="card"><div class="tele">'+E(S.output).replaceAll('\n','<br>')+'</div><button class="btn" id="back">Back to Script Studio</button></div>');byId('back').onclick=()=>{S.page='scripts';render()}}}
function knowledge(){shell(heading('PROJECT DATA','Knowledge Base','Starter references only; unverified details are excluded from scripts.')+'<div class="grid two">'+S.projectList.map(p=>'<div class="card"><div class="eyebrow">'+E(p.location)+'</div><h3>'+E(p.name)+'</h3>'+p.facts.map(x=>'<p class="muted">• '+E(x)+'</p>').join('')+'<span class="pill">'+(p.approved?'Approved':'Review before publication')+'</span></div>').join('')+'</div>')}
async function saveIdea(x){if(S.salesMode){try{await salesApi('create',{kind:'idea',content:x})}catch(e){alert(e.message);return}}else{const {error}=await sb.from('saved_ideas').insert({user_id:S.user.id,content:x});if(error){alert(error.message);return}}await sync()}
async function savePlan(x){const content={...x,stage:'idea'};if(S.salesMode){try{await salesApi('create',{kind:'plan',content})}catch(e){alert(e.message);return}}else{const {error}=await sb.from('content_plans').insert({user_id:S.user.id,content,status:'idea'});if(error){alert(error.message);return}}await sync()}
function saved(){shell(heading('PERSONAL LIBRARY','Saved Content','Ideas you have saved for future filming.')+'<div class="card">'+(S.saved.length?S.saved.map(x=>'<div class="listrow"><div><strong>'+E(x.content.hook)+'</strong><div class="muted">'+E(x.content.project)+'</div></div><div class="actions"><button class="btn secondary tiny" data-copy="'+x.id+'">Copy</button><button class="btn secondary tiny" data-delete="'+x.id+'">Delete</button></div></div>').join(''):'No saved concepts yet.')+'</div>');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(S.saved.find(x=>x.id===b.dataset.copy).content.script));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(S.salesMode){await salesApi('delete',{id:b.dataset.delete})}else await sb.from('saved_ideas').delete().eq('id',b.dataset.delete);await sync();render()})}
function planner(){shell(heading('PRODUCTION PIPELINE','Content Planner','Organize the journey from idea to published video.')+'<div class="card">'+(S.plans.length?S.plans.map(x=>'<div class="listrow"><div><strong>'+E(x.content.hook)+'</strong><div class="muted">'+E(x.content.project)+'</div></div><div><select data-stage="'+x.id+'">'+['idea','filming','in_review','published'].map(v=>'<option value="'+v+'" '+(x.status===v?'selected':'')+'>'+v.replace('_',' ')+'</option>').join('')+'</select></div></div>').join(''):'No planned content. Start from Idea Generator.')+'</div>');document.querySelectorAll('[data-stage]').forEach(b=>b.onchange=async()=>{if(S.salesMode){await salesApi('status',{id:b.dataset.stage,status:b.value})}else await sb.from('content_plans').update({status:b.value}).eq('id',b.dataset.stage);await sync()})}
function admin(){if(S.role!=='admin'){shell(heading('ACCESS CONTROL','Marketing Admin','This section is restricted to Marketing administrators.')+'<div class="notice">Your account does not have administrator privileges. Contact Marketing.</div>');return}shell(heading('MARKETING CONTROL','Admin Workspace','Manage the approved project knowledge base.')+'<div class="grid two"><div class="card"><h3>Knowledge status</h3><div class="metric">'+S.projectList.length+'</div><p class="muted">Projects available to agents</p></div><div class="card"><h3>Review checklist</h3><p class="muted">Approve pricing, amenities, delivery dates, claims and Arabic/English names before publication.</p></div></div><div class="card"><h3>Current database content</h3>'+S.projectList.map(p=>'<div class="listrow"><strong>'+E(p.name)+'</strong><small>'+E(p.location)+'</small></div>').join('')+'<p class="muted">The current release manages project approval and updates through the Supabase dashboard. Inline editing is a next-phase feature.</p></div>')}
async function sync(){if(S.salesMode){const data=await salesApi('list');S.saved=data.ideas||[];S.plans=data.plans||[];S.role='agent';return}const [pr,saved,plans,role]=await Promise.all([sb.from('projects').select('*').eq('approved',true),sb.from('saved_ideas').select('*').order('created_at',{ascending:false}),sb.from('content_plans').select('*').order('created_at',{ascending:false}),sb.from('profiles').select('role').eq('id',S.user.id).maybeSingle()]);if(pr.data?.length)S.projectList=pr.data;S.saved=saved.data||[];S.plans=plans.data||[];S.role=role.data?.role||'agent';if(!S.projectList.some(p=>p.slug===S.project))S.project=S.projectList[0]?.slug||'general'}
function auth(){root.innerHTML='<div class="auth-bg"><section class="auth-visual"><img src="assets/taameer-logo.svg" alt="TAAMEER"><div><div class="eyebrow" style="color:#b4c0a8">TAAMEER / AGENT STUDIO</div><h1>Every property.<br>Every story.<br><em>Your name on it.</em></h1><p style="color:#b2bcb1;font-size:13px;margin-top:26px">Your content. Our identity.</p></div><div style="font-size:11px;color:#8f9d8e;letter-spacing:.1em">TAAMEER MARKETING DEPARTMENT</div></section><section class="auth-formzone"><div class="auth"><div class="eyebrow">WELCOME TO YOUR CREATIVE WORKSPACE</div><h2>Make something great.</h2><p class="muted">Access your content studio with the team password. No individual account is needed.</p><div class="field" style="margin-top:30px"><label>SALES TEAM ACCESS PASSWORD</label><input id="salesPassword" type="password" autocomplete="off" placeholder="Enter your password"></div><button class="btn" id="salesLogin">Enter Studio →</button><p class="notice hide" id="error"></p><details><summary>Marketing administration</summary><div class="field"><label>Marketing account</label><input id="adminEmail" type="text" autocomplete="username" placeholder="Account identifier"></div><div class="field"><label>Administrator password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password"></div><button id="adminLogin" class="btn secondary">Admin sign in</button></details></div></section></div>';byId('salesLogin').onclick=async()=>{const button=byId('salesLogin');button.disabled=true;S.salesPassword=byId('salesPassword').value;try{await salesApi('list');S.salesMode=true;S.user={id:'sales'};await sync();render()}catch(err){S.salesPassword='';byId('error').textContent='Unable to sign in. Check the password and try again.';byId('error').classList.remove('hide');button.disabled=false}};byId('adminLogin').onclick=async()=>{const button=byId('adminLogin');button.disabled=true;const {error}=await sb.auth.signInWithPassword({email:byId('adminEmail').value,password:byId('adminPassword').value});if(error){byId('error').textContent='Administrator sign-in failed.';byId('error').classList.remove('hide');button.disabled=false}}}
function render(){if(!S.user)return auth();({overview,brain,ideas,scripts,knowledge,planner,saved,admin}[S.page]||overview)()}
sb.auth.onAuthStateChange((_event,session)=>{if(S.salesMode)return;S.user=session?.user||null;setTimeout(async()=>{if(S.user)await sync();render()},0)});
</script></body></html>
